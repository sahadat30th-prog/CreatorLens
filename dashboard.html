<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard — CreatorLens</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b10;
      color: white;
      font-family: Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: auto;
    }

    /* NAVBAR */

    nav {
      border-bottom: 1px solid #22222c;
      padding: 18px 0;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logo span {
      color: #7c5cff;
    }

    .logout {
      color: #9999a8;
      font-size: 14px;
    }

    /* HEADER */

    .header {
      padding: 45px 0 25px;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .header p {
      color: #9999a8;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: #111119;
      border: 1px solid #292936;
      border-radius: 14px;
      padding: 22px;
    }

    .stat-title {
      color: #9999a8;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
    }

    /* UPLOAD */

    .upload {
      background: #111119;
      border: 1px solid #292936;
      border-radius: 16px;
      padding: 35px;
      text-align: center;
      margin-bottom: 25px;
    }

    .upload-icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .upload h2 {
      margin-bottom: 10px;
    }

    .upload p {
      color: #9999a8;
      margin-bottom: 22px;
    }

    .upload-btn {
      display: inline-block;
      background: #7c5cff;
      padding: 13px 22px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    /* RECENT ANALYSIS */

    .recent {
      background: #111119;
      border: 1px solid #292936;
      border-radius: 16px;
      padding: 25px;
    }

    .recent h2 {
      margin-bottom: 20px;
    }

    .analysis-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 17px 0;
      border-top: 1px solid #292936;
    }

    .analysis-name {
      font-weight: bold;
    }

    .analysis-date {
      color: #777789;
      font-size: 13px;
      margin-top: 4px;
    }

    .score {
      font-weight: bold;
      color: #7c5cff;
    }

    .empty {
      color: #777789;
      text-align: center;
      padding: 30px 0;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .stats {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 28px;
      }

      .upload {
        padding: 28px 18px;
      }

      .analysis-item {
        gap: 15px;
      }
    }

  </style>
</head>

<body>

  <!-- NAVIGATION -->

  <nav>

    <div class="container nav">

      <div class="logo">
        Creator<span>Lens</span>
      </div>

      <a href="index.html" class="logout">
        Logout
      </a>

    </div>

  </nav>


  <!-- MAIN -->

  <main>

    <div class="container">

      <!-- HEADER -->

      <div class="header">

        <h1>
          Welcome, Creator 👋
        </h1>

        <p>
          Analyze your videos and discover how to improve them.
        </p>

      </div>


      <!-- STATS -->

      <div class="stats">

        <div class="stat">

          <div class="stat-title">
            Analyses remaining
          </div>

          <div class="stat-value">
            3
          </div>

        </div>


        <div class="stat">

          <div class="stat-title">
            Current plan
          </div>

          <div class="stat-value">
            Free
          </div>

        </div>


        <div class="stat">

          <div class="stat-title">
            Videos analyzed
          </div>

          <div class="stat-value">
            0
          </div>

        </div>

      </div>


      <!-- UPLOAD -->

      <div class="upload">

        <div class="upload-icon">
          🎥
        </div>

        <h2>
          Analyze a video
        </h2>

        <p>
          Upload a video and discover its strengths,
          weaknesses and improvement opportunities.
        </p>

        <label for="video-upload" class="upload-btn">
          Choose Video
        </label>

        <input
          type="file"
          id="video-upload"
          accept="video/*"
        >

      </div>


      <!-- RECENT ANALYSES -->

      <div class="recent">

        <h2>
          Recent analyses
        </h2>

        <div class="empty">
          No videos analyzed yet.
        </div>

      </div>

    </div>

  </main>

</body>
  </html>
